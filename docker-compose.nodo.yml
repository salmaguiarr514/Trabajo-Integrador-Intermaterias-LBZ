# PC 2 y PC 3: solo una réplica de la API, conectada a la base de la PC de acceso.
# En el .env de cada PC: INSTANCIA=api2 (PC 2) o api3 (PC 3), IP_PC1 con la IP de la PC de acceso
# y el mismo JWT_SECRET que en las demás.
#
# Levantar: docker compose -f docker-compose.nodo.yml up -d --build

services:
  api:
    build: ./api-eventos
    container_name: eventos-${INSTANCIA}
    restart: unless-stopped
    environment:
      PORT: 3000
      INSTANCIA: ${INSTANCIA}
      DB_HOST: ${IP_PC1}
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRA: ${JWT_EXPIRA:-8h}
      GMAIL_USUARIO: ${GMAIL_USUARIO:-}
      GMAIL_CLAVE_APP: ${GMAIL_CLAVE_APP:-}
    ports:
      - "3000:3000"
